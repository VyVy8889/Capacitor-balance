<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cân bằng Điện dung Giàn tụ 6 Nhánh (Vế Trái / Vế Phải)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-xl">
            <h1 class="text-2xl font-bold text-cyan-400 mb-2">Cân bằng Điện dung Giàn tụ 6 Nhánh</h1>
            <p class="text-slate-300 text-sm mb-4">
                Tối ưu độc lập 3 nhánh Vế Trái (N<sub>L</sub>), 3 nhánh Vế Phải (N<sub>R</sub>) & đồng bộ cân bằng 3 Pha (A, B, C) cho giàn tụ bù trung/cao thế.
            </p>
            <div class="inline-flex items-center bg-cyan-950/60 border border-cyan-800/60 rounded-full px-3 py-1 text-xs text-cyan-300 font-medium">
                ⚡ Sơ đồ 6 nhánh bất đối xứng 2 vế
            </div>
        </div>

        <!-- Cấu hình số bình -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-xl">
            <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                <span class="bg-cyan-500 text-slate-950 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs font-bold">1</span>
                Cấu hình số bình tụ
            </h2>

            <!-- Preset nhanh -->
            <div class="flex flex-wrap gap-2 mb-4">
                <button onclick="setPreset(2, 3)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-lg border border-slate-600 transition">
                    2 Trái - 3 Phải (Tổng: 15 bình)
                </button>
                <button onclick="setPreset(4, 4)" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-lg border border-slate-600 transition">
                    4 Trái - 4 Phải (Tổng: 24 bình)
                </button>
                <button onclick="setPreset(8, 8)" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-xs font-bold rounded-lg border border-cyan-500 transition text-white">
                    8 Trái - 8 Phải (Tổng: 48 bình)
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Số bình mỗi nhánh Vế Trái (N<sub>L</sub>)</label>
                    <input type="number" id="nl-input" value="8" min="1" max="50" oninput="updateRequirement()"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-semibold focus:outline-none focus:border-cyan-500">
                    <span id="nl-total-desc" class="text-xs text-slate-400 mt-1 block">3 nhánh Trái = 24 bình</span>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Số bình mỗi nhánh V
